general {
	output_format = "i3bar"
        colors = true
        interval = 5
}

order += "ipv6"
order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "disk /"
order += "load"
order += "memory"
order += "tztime local"

wireless _first_ {
        format_up = "W: (%quality at %essid) %ip"
        format_down = "W: down"
}

ethernet _first_ {
        format_up = "E: %ip (%speed)"
        format_down = "E: down"
}

battery all {
	format = "%percentage"
	last_full_capacity = true
	threshold_type=percentage
	low_threshold=10
}

disk "/" {
        format = "%avail"
}

load {
        format = "%1min"
}

memory {
        format = "U: %used | A: %available"
        threshold_degraded = "1G"
        format_degraded = "MEMORY < %available"
}

tztime local {
        format = "%d-%m-%y %H:%M:%S"
}
